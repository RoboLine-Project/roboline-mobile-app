name: roboline_mobile
description: "RoboLine AGV Kontrol Sistemi"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Kütüphanelerin senin sistemindeki en güncel halleri
  mqtt_client: ^10.11.11
  supabase_flutter: ^2.12.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/login_bg.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
